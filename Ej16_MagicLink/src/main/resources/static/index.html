<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso - Magic Link</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">
	<div class="card shadow-sm" style="width: 24rem;">
		<div class="card-body">
			<h1 class="h4 mb-3 text-center">Acceso</h1>

			<form action="/magic-link/solicitar" method="post">
				<div class="mb-3">
					<label for="correo" class="form-label">Correo electronico</label>
					<input type="email" class="form-control" id="correo" name="correo" required autofocus>
				</div>
				<button type="submit" class="btn btn-primary w-100">Pedir enlace magico</button>
			</form>
		</div>
	</div>
</div>

</body>
</html>
