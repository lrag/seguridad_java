<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expedientes X - Acceso</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">
	<div class="card shadow-sm" style="width: 24rem;">
		<div class="card-body">
			<h1 class="h4 mb-3 text-center">JWT 2</h1>

			<div id="mensajeError" class="alert alert-danger d-none" role="alert"></div>

			<form id="formLogin">
				<div class="mb-3">
					<label for="username" class="form-label">Usuario</label>
					<input type="text" class="form-control" id="username" required autofocus>
				</div>
				<div class="mb-3">
					<label for="password" class="form-label">Contraseña</label>
					<input type="password" class="form-control" id="password" required>
				</div>
				<button type="submit" class="btn btn-primary w-100">Entrar</button>
			</form>
		</div>
	</div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
