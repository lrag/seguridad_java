<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAG del comedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4" style="max-width: 760px;">

    <h1 class="h3 mb-4">RAG del comedor</h1>

    <!-- El formulario: la pregunta se envia por POST a /consulta (ControladorWeb). -->
    <form th:action="@{/consulta}" method="post" class="mb-4">
        <label for="pregunta" class="form-label">Pregunta</label>
        <div class="input-group">
            <input type="text" id="pregunta" name="pregunta" class="form-control" list="preguntas-ejemplo"
                   placeholder="¿Qué hay de primer plato en el comedor y cuál es el postre?"
                   th:value="${resultado != null} ? ${resultado.pregunta}" required autofocus>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </div>
        <!-- Las preguntas de ejemplo del script Python, como sugerencias de la caja de texto. -->
        <datalist id="preguntas-ejemplo">
            <option value="¿Qué hay de primer plato en el comedor y cuál es el postre?">
            <option value="Puedo reservar mesa con antelación">
            <option value="Hoy me apetece algo dulce">
            <option value="¿dónde está un pueblo llamado la cisterniga?">
            <option value="Quiero comer a las doce">
            <option value="Quiero comer a las 14:00">
            <option value="Vivo en Alicante. ¿Qué ruta debo tomar hasta el comedor?">
        </datalist>
    </form>

    <!-- La respuesta, solo despues de una consulta. th:text escapa el texto:
         lo que devuelva el modelo se muestra como texto, nunca como HTML. -->
    <div th:if="${resultado != null}">
        <div class="card mb-3">
            <div class="card-header">Respuesta</div>
            <div class="card-body" id="respuesta" style="white-space: pre-wrap;" th:text="${resultado.respuesta}"></div>
        </div>
        <div class="card border-secondary">
            <div class="card-header text-secondary">Contexto recuperado de la base vectorial</div>
            <div class="card-body text-secondary small" th:text="${resultado.contexto}"></div>
        </div>
    </div>

</div>
</body>
</html>
