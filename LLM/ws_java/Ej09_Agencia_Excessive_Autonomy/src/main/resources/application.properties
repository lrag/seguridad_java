spring.application.name=ej09-agencia-excessive-autonomy
spring.main.web-application-type=none
logging.level.root=WARN

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.1:8b
spring.ai.ollama.chat.options.temperature=0.0
# Sin este limite, el modelo puede entrar en una generacion practicamente sin
# fin de llamadas a eliminar_archivo (conecta con LLM06). Se acota solo para
# que la demo termine en un tiempo razonable.
spring.ai.ollama.chat.options.num-predict=300
