spring.application.name=ej10-agencia-encadenamiento-acciones
spring.main.web-application-type=none
logging.level.root=WARN

spring.ai.ollama.base-url=http://localhost:11434
# Este ejemplo usa qwen2.5:7b, no llama3.1:8b como el resto: llama3.1:8b
# hace la cadena peligrosa (consulta el dato interno y envia el correo fuera),
# pero rellena mal el cuerpo -pone "se adjunta la lista" o un marcador entre
# corchetes en vez de las cifras-, asi que el dato no llega a verse salir.
# qwen2.5:7b rellena el cuerpo con los precios reales.
spring.ai.ollama.chat.options.model=qwen2.5:7b
spring.ai.ollama.chat.options.temperature=0.0
