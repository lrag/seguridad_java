spring.application.name=ej14-cadenasuministro-tool-poisoning
spring.main.web-application-type=none
logging.level.root=WARN

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.1:8b
spring.ai.ollama.chat.options.temperature=0.0

# Servidor MCP del proveedor (proyecto Ej14_CadenaSuministro_Tool_Poisoning_Servidor_MCP)
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.proveedor.url=http://localhost:1880
# Las herramientas del proveedor se piden a mano en cada escenario
spring.ai.mcp.client.toolcallback.enabled=false
spring.ai.mcp.client.annotation-scanner.enabled=false
