#

#Certificado para el servidor (localhost)
#La clave privada. Escogemos 2048 en vez de 4096 porque este certificado caduca antes que el de la CA y con 4096 bits de clave para
#hacer el tls handshake con los clientes tarda 5 veces m�s en calcularse la verificación del certificado que con 2096 
#
#openssl genrsa -out servidor_localhost.key 2048
#-servidor_localhost.key

#Creamos la solicitud para firmar el certificado del servidor por parte de la Intermediate CA
#openssl req -new -key servidor_localhost.key -out servidor_localhost.csr -subj "/CN=localhost/O=Api de pel�culas/C=ES"
#-servidor_localhost.csr

#Creamos el fichero
#-servidor_localhost_extensions.txt
#
#authorityKeyIdentifier=keyid,issuer
#basicConstraints=CA:FALSE
#keyUsage = critical, digitalSignature, keyEncipherment
#subjectAltName = @alt_names
#[alt_names]
#DNS.1 = localhost
#
#No será un certificado con el que se puedan firmar otros
#DNS.1 = localhost Este certificado es para el dominio "localhost", no se podr� utilizar en un servidor que est� en otro dominio

#Firmamos el certificado del servidor con la CA intermedia y el fichero anterior
#100 años para que no tenga que volver a crearlo para otros cursos XD
#openssl x509 -req -in servidor_localhost.csr -CA AntunezIntermediateCA.crt -CAkey AntunezIntermediateCA.key -CAcreateserial -out servidor_localhost.crt -days 36500 -sha256 -extfile servidor_localhost_extensions.txt
#-servidor_localhost.crt
#
#Ya podríamos borrar el .csr
#Colocaremos este certificado en el tomcat

#Guardar el certificado del servidor en un fichero PKCS12
#openssl pkcs12 -export -in servidor_localhost.crt -inkey servidor_localhost.key -out servidor_localhost.p12 -name tomcat -CAfile AntunezIntermediateCA.crt -caname root
#contraseña: changeme
#-servidor_localhost.p12

server.ssl.key-store-type: PKCS12
server.ssl.key-store: classpath:servidor_localhost.p12
server.ssl.key-store-password: ${CLAVE_ALMACEN:changeme}
server.ssl.key-alias: tomcat
server.ssl.key-password: changeme
server.ssl.enabled: true
server.port: 8443

#TRUSTSTORE
#
#keytool -importcert -file AntunezIntermediateCA.crt -alias intermediaca -keystore truststore.p12 -storetype PKCS12
#changeme
#-truststore.p12

server.ssl.trust-store-type: PKCS12
server.ssl.trust-store: "classpath:truststore.p12"
server.ssl.trust-store-password: "changeme"
server.ssl.client-auth: need # Obliga a pedir certificado

