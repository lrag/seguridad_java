#subjectKeyIdentifier = hash
#authorityKeyIdentifier = keyid:always,issuer
#basicConstraints = critical, CA:true, pathlen:0
#keyUsage = critical, digitalSignature, cRLSign, keyCertSign

#Firmar la CA intermedia con la CA root
#Ahora si que se creará un certificado, pero no raíz ni auto firmado: firmado por nuestra root CA
#
#openssl x509 -req -in AntunezIntermediateCA.csr -CA AntunezRootCA.crt -CAkey AntunezRootCA.key -CAcreateserial -out AntunezIntermediateCA.crt -days 3650 -sha256 -extfile AntunezIntermediateCA_extensions.txt
