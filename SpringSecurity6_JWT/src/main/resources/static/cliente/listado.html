<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expedientes X - Películas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">

	<!-- Botones -->
	<div id="barraBotones" class="d-flex justify-content-between align-items-center mb-3">
		<h1 class="h4 mb-0">Expedientes X - Películas</h1>
		<div>
			<button id="btnNueva" type="button" class="btn btn-success">Nueva</button>
			<button id="btnRecargar" type="button" class="btn btn-secondary">Recargar</button>
			<button id="btnLogout" type="button" class="btn btn-outline-danger">Cerrar sesión</button>
		</div>
	</div>

	<div id="mensaje" class="alert d-none" role="alert"></div>

	<!-- Formulario -->
	<div class="card mb-4">
		<div class="card-body">
			<h2 class="h6" id="tituloFormulario">Nueva película</h2>
			<form id="formPelicula" class="row g-3">
				<input type="hidden" id="id">
				<div class="col-md-4">
					<label for="titulo" class="form-label">Título</label>
					<input type="text" class="form-control" id="titulo" required>
				</div>
				<div class="col-md-3">
					<label for="director" class="form-label">Director</label>
					<input type="text" class="form-control" id="director">
				</div>
				<div class="col-md-3">
					<label for="genero" class="form-label">Género</label>
					<input type="text" class="form-control" id="genero">
				</div>
				<div class="col-md-2">
					<label for="year" class="form-label">Año</label>
					<input type="number" class="form-control" id="year">
				</div>
				<div class="col-12">
					<button type="submit" class="btn btn-primary">Guardar</button>
					<button type="button" id="btnCancelar" class="btn btn-link">Cancelar edición</button>
				</div>
			</form>
		</div>
	</div>

	<!-- Tabla -->
	<table class="table table-striped table-hover align-middle">
		<thead>
			<tr>
				<th>ID</th>
				<th>Título</th>
				<th>Director</th>
				<th>Género</th>
				<th>Año</th>
				<th class="text-end">Acciones</th>
			</tr>
		</thead>
		<tbody id="tablaPeliculas"></tbody>
	</table>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/peliculas.js"></script>
</body>
</html>
